name: Test MVP
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: navigator
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: navigator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://navigator:local-ci-only@localhost:5432/navigator_test
      RUN_LIVE_GEMINI: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.lock
      - run: python scripts/manage.py validate database/seeds/candidates.json
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate native JavaScript modules
        run: find frontend/js -name '*.js' -exec node --check {} \;
