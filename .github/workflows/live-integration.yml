name: Live development integrations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r backend/requirements-dev.lock
      - name: Test real development PostgreSQL and Gemini
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
          RUN_LIVE_GEMINI: '1'
        run: |
          test -n "$TEST_DATABASE_URL"
          test -n "$GEMINI_API_KEY"
          pytest -q
